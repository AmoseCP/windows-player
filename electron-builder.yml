appId: com.bethelchurch.audioplayer
productName: Bethel Church Audio Player
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,PLAN.md,PROMPT.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# 双击音频文件可用本播放器打开
fileAssociations:
  - ext: [mp3, flac, wav, ogg, aac, m4a, wma]
    name: 音频文件
    description: 音频文件
    role: Viewer
  - ext: [m3u, m3u8]
    name: 播放列表
    description: 播放列表
    role: Viewer
win:
  executableName: bethel-church-audio-player
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 按用户安装，无需管理员权限即可安装使用
  perMachine: false
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
npmRebuild: false
